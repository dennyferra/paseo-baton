name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check the tag matches package.json
        run: |
          test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
      # No token: npm authenticates this workflow through the trusted publisher set on npmjs.com,
      # and adds provenance automatically.
      - run: npm publish --access public
